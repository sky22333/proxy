mixed-port: 7890

ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter: [geosite:private]         # 内网域名不伪造，保住局域网发现
  default-nameserver: [223.5.5.5, 119.29.29.29]   # 默认含不可达的 8.8.8.8，必须覆盖
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:                  # 解析节点域名，杜绝回环
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "geosite:geolocation-!cn": [https://1.1.1.1/dns-query]
  respect-rules: true                       # 让 1.1.1.1 走代理

proxies:
  - name: sq
    type: shadowquic
    server: 203.0.113.10
    port: 443
    username: abc7f3a91c2
    password: "K9mQ2xR7vT4pL8nW6sY1bJ5hD3gF0aZc"
    sni: www.intel.com
    alpn: [h3]
    quic-versions: [v1]
    zero-rtt: false
    congestion-controller: bbr
    keep-alive-interval: 15000

proxy-groups:
  - name: PROXY
    type: select
    proxies: [sq, DIRECT]

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,PROXY
