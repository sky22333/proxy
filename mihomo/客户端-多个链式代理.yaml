# 全局配置
mixed-port: 7890          # 入站混合协议
allow-lan: false          # 局域网连接
mode: rule                # 规则模式
log-level: info          # 日志级别

geox-url:
  geoip: "https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://gh-proxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"

# 防DNS泄漏和污染
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter: [geosite:private]
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "geosite:private": [system]
    "geosite:geolocation-!cn": [https://1.1.1.1/dns-query]
  respect-rules: true

# 分割线 =============================（以下节点配置可直接复制到Clash-Verge配置，用作客户端配置链式代理）

proxies:
# AnyTLS代理 - 第一个出站代理
- name: "anytls-out"
  type: anytls
  server: example.com # 服务端地址（你的域名）
  port: 8443 # 节点端口
  password: "aHR0cHM6Ly9ibG9nLjUyMDEzMTIwLnh5ei8=" # 协议认证密码
  udp: true
  tls: true
  servername: example.com # 你的域名

# SOCKS5代理 - 通过AnyTLS代理链式连接到目标
- name: "socks-proxy"
  type: socks5
  server: 127.0.0.1      # SOCKS服务器地址
  port: 1080             # SOCKS端口
  username: "sockuser"   # SOCKS认证用户名（可选）
  password: "sockpass"   # SOCKS认证密码（可选）
  dialer-proxy: "anytls-out"  # 通过AnyTLS代理建立到SOCKS的连接
  udp: true

# SS协议 - 第二个出站代理
- name: "ss-out"
  type: ss
  server: 127.0.0.1
  port: 9527
  cipher: aes-128-gcm
  password: "password"
  udp: true

# 第二个SOCKS5代理 - 通过SS代理链式连接到目标
- name: "socks-proxy2"
  type: socks5
  server: 192.168.1.100    # 第二个SOCKS服务器地址
  port: 1081               # 不同的SOCKS端口
  username: "sockuser2"    # 第二个SOCKS认证用户名（可选）
  password: "sockpass2"    # 第二个SOCKS认证密码（可选）
  dialer-proxy: "ss-out"   # 通过SS代理建立到SOCKS的连接
  udp: true

rules:
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.17.0.1/16,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - GEOIP,CN,DIRECT
  - DOMAIN-SUFFIX,example.org,socks-proxy2  # 第二条链：SS → SOCKS2
  - MATCH,socks-proxy  # 默认流量走链式代理：AnyTLS → SOCKS
