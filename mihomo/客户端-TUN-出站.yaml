# 全局配置
mixed-port: 7890          # 入站混合协议
allow-lan: false          # 局域网连接
mode: rule                # 规则模式

# 开启tun模式
tun:
  enable: true
  stack: system
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  device: utun0
  mtu: 9000
  strict-route: true

# 防DNS泄漏和污染
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter: [geosite:private]
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "geosite:private": [system]
    "geosite:geolocation-!cn": [https://1.1.1.1/dns-query]
  respect-rules: true


# 分割线 =============================（以下节点配置可直接复制到Clash-Verge配置，用作客户端配置）

proxies:
- name: "anytls-out"
  type: anytls
  server: example.com # 服务端地址（你的域名）
  port: 8443 # 节点端口
  password: "aHR0cHM6Ly9ibG9nLjUyMDEzMTIwLnh5ei8=" # 协议认证密码
  udp: true
  tls: true
  servername: example.com # 你的域名

# 备用SSH协议
- name: "ssh-out"
  type: ssh
  server: 127.0.0.1
  port: 22
  username: root
  password: password

# 备用SS协议
- name: "ss-out"
  type: ss
  server: 127.0.0.1
  port: 9527
  cipher: aes-128-gcm
  password: "password"
  udp: true

# 代理组配置（备用线路需手动切换，故用 select 组承接）
proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "anytls-out"
      - "ssh-out"
      - "ss-out"
      - DIRECT

rules:
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.17.0.1/16,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,节点选择

