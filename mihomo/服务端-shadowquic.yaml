# /etc/mihomo/config.yaml
log-level: info
ipv6: false

listeners:
  - name: sq-in
    type: shadowquic
    listen: 0.0.0.0
    port: 443
    users:
      - username: abc7f3a91c2
        password: "K9mQ2xR7vT4pL8nW6sY1bJ5hD3gF0aZc"   # openssl rand -base64 24
      # 一个用户一条，便于单独吊销
    jls-upstream:
      addr: www.intel.com:443 # 必须支持 HTTP/3
      sni: www.intel.com      # 与客户端 sni 完全一致
      rate-limit: 10000000         # bit/s，限制探测者拿你当免费代理打真站
    alpn: [h3]
    quic-versions: [v1]
    zero-rtt: false
    congestion-controller: bbr
    bbr-profile: standard
    cwnd: 32
    max-idle-time: 30000
    max-datagram-frame-size: 1400
    disable-mtu-discovery: false
    proxy: DIRECT                  # 认证通过后的流量直接出网

rules:
  - MATCH,DIRECT
